# 零安装依赖；浏览器测试使用 runner 提供的 Chrome。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 构建、完整回归与实际安装包校验
        run: npm run release
